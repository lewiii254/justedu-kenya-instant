<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" stroke="#1E40AF" stroke-width="2"/>
  
  <!-- JE letters -->
  <text x="50" y="63" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">JE</text>
  
  <!-- Small mobile signal indicator -->
  <g transform="translate(70, 15)">
    <rect x="0" y="12" width="3" height="4" fill="#10B981" rx="1"/>
    <rect x="5" y="8" width="3" height="8" fill="#10B981" rx="1"/>
    <rect x="10" y="4" width="3" height="12" fill="#10B981" rx="1"/>
  </g>
</svg>
