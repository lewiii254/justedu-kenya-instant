<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="rgba(255,255,255,0.1)"/>
  <circle cx="1100" cy="530" r="200" fill="rgba(255,255,255,0.1)"/>
  
  <!-- Logo circle -->
  <circle cx="200" cy="315" r="80" fill="white" opacity="0.9"/>
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="50" font-weight="bold" fill="#0EA5E9" text-anchor="middle">JE</text>
  
  <!-- Main text -->
  <text x="350" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">JustEdu Kenya</text>
  <text x="350" y="360" font-family="Arial, sans-serif" font-size="48" fill="white" opacity="0.95">Instant Airtime & Data Bundles</text>
  
  <!-- Features -->
  <g transform="translate(350, 420)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" fill="white">⚡ Instant Delivery</text>
    <text x="250" y="0" font-family="Arial, sans-serif" font-size="28" fill="white">🔒 Secure M-Pesa</text>
    <text x="500" y="0" font-family="Arial, sans-serif" font-size="28" fill="white">📱 All Networks</text>
  </g>
  
  <!-- Footer badge -->
  <rect x="350" y="500" width="300" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="500" y="532" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">Kenya's #1 Choice 🇰🇪</text>
</svg>
